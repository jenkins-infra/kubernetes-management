jenkins:
  numExecutors: 0
  clouds:
    - kubernetes:
        containerCapStr: "100"
        credentialsId: "infraci.jenkins.io-agents-1-jenkins-agent-sa-token"
        serverCertificate: "${decodeBase64:${INFRACIJENKINSIO_AGENTS_1_CACRT}}"
        # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
        serverUrl: "https://infracijenkinsioagents1-wzkg3k2f.hcp.eastus2.azmk8s.io:443"
        maxRequestsPerHostStr: "300"
        webSocket: true
        name: "kubernetes_infracijioagents1"
        namespace: "jenkins-infra-agents"
        podLabels:
          - key: "jenkins/infra-ci-jenkins-io-agent"
            value: "true"
          - key: "jenkins"
            value: "agent"
          - key: "azure.workload.identity/use"
            value: "true"
        podRetention: "Never"
        templates:
          - name: jnlp-linux-amd64
            nodeSelector: "kubernetes.io/arch=amd64"
            containers:
              - name: jnlp
                image: dockerhubmirror.azurecr.io/jenkinsciinfra/jenkins-agent-ubuntu-22.04:2.155.0
                command: "/usr/local/bin/jenkins-agent"
                args: ""
                envVars:
                  - envVar:
                      key: "JENKINS_JAVA_BIN"
                      value: "/opt/jdk-25/bin/java"
                  - envVar:
                      key: "JAVA_HOME"
                      value: "/opt/jdk-25"
                  - envVar:
                      key: "JENKINS_JAVA_OPTS"
                      value: "-XX:+PrintCommandLineFlags"
                  - envVar:
                      key: "PATH"
                      # TODO: track with updatecli
                      value: "/opt/nodejs/bin:/home/jenkins/.asdf/shims:/home/jenkins/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/local/go/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
                resourceLimitMemory: "8G"
                resourceRequestCpu: "500m"
                resourceRequestMemory: "1G"
                alwaysPullImage: true
            label: "linux jnlp-linux jnlp-linux-amd64 container kubernetes node ruby webbuilder"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
            serviceAccount: "jenkins-infra-agent"
            yamlMergeStrategy: "merge"
            yaml: |-
              apiVersion: v1
              kind: Pod
              spec:
                initContainers:
                  - name: restore-maven-cache
                    image: dockerhubmirror.azurecr.io/jenkinsciinfra/jenkins-agent-ubuntu-22.04:2.155.0
                    command:
                      - /bin/bash
                      - -c
                    args:
                      - |
                        set -euxo pipefail

                        # Retrieve and restore Maven cache from the regional Azure Fileshare
                        export AZCOPY_AUTO_LOGIN_TYPE=WORKLOAD
                        azcopy login --identity
                        fileshare_url=https://cacheeastus2.file.core.windows.net/cache-east-us-2
                        mvn_local_repo=/home/jenkins/.m2/repository
                        mkdir -p "^${mvn_local_repo}"
                        # Marker file containing the archive name created in https://github.com/jenkins-infra/infra-cronjobs/blob/maven-cacher/create-archive.sh
                        azcopy copy "^${fileshare_url}/maven_cache_archive_name" "^${mvn_local_repo}"
                        archive_name="$(cat "^${mvn_local_repo}/maven_cache_archive_name")"
                        time azcopy copy "^${fileshare_url}/^${archive_name}" "^${mvn_local_repo}"
                        time tar xf "^${mvn_local_repo}/^${archive_name}" --owner=jenkins --group=jenkins -C "^${mvn_local_repo}"
                    volumeMounts:
                      - name: maven-cache
                        mountPath: /home/jenkins/.m2
                containers:
                  - name: jnlp
                    volumeMounts:
                      - name: maven-cache
                        mountPath: /home/jenkins/.m2
                volumes:
                  - name: maven-cache
                    emptyDir: {}
                tolerations:
                  - key: "jenkins"
                    operator: "Equal"
                    value: "infra.ci.jenkins.io"
                    effect: "NoSchedule"
                  - key: "infra.ci.jenkins.io/agents"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"
                  - key: "kubernetes.azure.com/scalesetpriority"
                    operator: "Equal"
                    value: "spot"
                    effect: "NoSchedule"
          - name: jnlp-linux-arm64
            nodeSelector: "kubernetes.io/arch=arm64"
            containers:
              - name: jnlp
                image: dockerhubmirror.azurecr.io/jenkinsciinfra/jenkins-agent-ubuntu-22.04:2.155.0
                command: "/usr/local/bin/jenkins-agent"
                args: ""
                envVars:
                  - envVar:
                      key: "JENKINS_JAVA_BIN"
                      value: "/opt/jdk-25/bin/java"
                  - envVar:
                      key: "JAVA_HOME"
                      value: "/opt/jdk-25"
                resourceLimitMemory: "2048Mi"
                resourceRequestCpu: "500m"
                resourceRequestMemory: "512Mi"
                alwaysPullImage: true
            label: "jnlp-linux-arm64"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
            serviceAccount: "jenkins-infra-agent"
            yamlMergeStrategy: "merge"
            yaml: |-
              apiVersion: v1
              kind: Pod
              spec:
                initContainers:
                  - name: restore-maven-cache
                    image: dockerhubmirror.azurecr.io/jenkinsciinfra/jenkins-agent-ubuntu-22.04:2.155.0
